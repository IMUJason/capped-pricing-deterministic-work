study_name: solomon_main_attribution
instances:
  - C101
  - C201
  - R101
  - R201
  - RC101
  - RC201
variants:
  - name: diversified_root
    strategy: diversified
    candidate_pool_size: 20
    add_count: 10
    pricing_time_limit: 30
    pricing_threads: 1
    max_iterations: 40
    max_route_age: 1000
    diversity_cost_weight: 0.45
    enable_pool_pruning: false
  - name: reduced_cost_multi
    strategy: naive_multi
    candidate_pool_size: 20
    add_count: 10
    pricing_time_limit: 30
    pricing_threads: 1
    max_iterations: 40
    max_route_age: 1000
    diversity_cost_weight: 0.45
    enable_pool_pruning: false
    adaptive_hardening: false
  - name: stabilization_only
    strategy: naive_multi
    candidate_pool_size: 20
    add_count: 10
    pricing_time_limit: 30
    pricing_threads: 1
    max_iterations: 40
    max_route_age: 1000
    diversity_cost_weight: 0.45
    enable_pool_pruning: false
    use_dual_stabilization: true
    stabilization_beta: 0.75
    adaptive_hardening: false
  - name: cuts_only
    strategy: naive_multi
    candidate_pool_size: 20
    add_count: 10
    pricing_time_limit: 30
    pricing_threads: 1
    max_iterations: 40
    max_route_age: 1000
    diversity_cost_weight: 0.45
    enable_pool_pruning: false
    use_subset_row_cuts: true
    max_subset_row_cuts: 12
    subset_row_customer_pool: 15
    subset_row_max_new_cuts: 2
    adaptive_hardening: false
  - name: reservoir_only
    strategy: naive_multi
    candidate_pool_size: 20
    add_count: 10
    pricing_time_limit: 30
    pricing_threads: 1
    max_iterations: 40
    max_route_age: 1000
    diversity_cost_weight: 0.45
    enable_pool_pruning: false
    use_route_reservoir: true
    reservoir_max_size: 1200
    exact_pricing_every: 2
    adaptive_hardening: false
  - name: always_hard_bundle
    strategy: adaptive_super
    candidate_pool_size: 20
    add_count: 10
    pricing_time_limit: 30
    pricing_threads: 1
    max_iterations: 40
    max_route_age: 1000
    diversity_cost_weight: 0.45
    enable_pool_pruning: false
    reduced_cost_weight: 0.50
    diversity_weight: 0.35
    ambiguity_weight: 0.15
    use_dual_stabilization: true
    stabilization_beta: 0.75
    use_subset_row_cuts: true
    max_subset_row_cuts: 12
    subset_row_customer_pool: 15
    subset_row_max_new_cuts: 2
    use_route_reservoir: true
    reservoir_max_size: 1200
    exact_pricing_every: 2
    adaptive_hardening: false
  - name: adaptive_super
    strategy: adaptive_super
    candidate_pool_size: 20
    add_count: 10
    pricing_time_limit: 30
    pricing_threads: 1
    max_iterations: 40
    max_route_age: 1000
    diversity_cost_weight: 0.45
    enable_pool_pruning: false
    reduced_cost_weight: 0.50
    diversity_weight: 0.35
    ambiguity_weight: 0.15
    use_dual_stabilization: true
    stabilization_beta: 0.75
    use_subset_row_cuts: true
    max_subset_row_cuts: 12
    subset_row_customer_pool: 15
    subset_row_max_new_cuts: 2
    use_route_reservoir: true
    reservoir_max_size: 1200
    exact_pricing_every: 2
    adaptive_hardening: true
    hard_runtime_trigger_fraction: 0.95
